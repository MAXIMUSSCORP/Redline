[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "redline"
dynamic = ["version"]
description = "Screens building electrical design packages for a qualified reviewer."
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0,<7", "Jinja2>=3.1,<4", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "pdfplumber>=0.11.9,<0.12", "ezdxf>=1.4,<2"]
dxf = ["ezdxf>=1.4,<2"]
pdf = ["pdfplumber>=0.11.9,<0.12"]

[project.scripts]
redline = "redline.cli:main"

[tool.setuptools.dynamic]
version = {attr = "redline.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"redline.report" = ["*.j2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live: needs AutoCAD or ODA on this machine"]
addopts = "-m 'not live'"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# _v() returns a fresh default_factory field per attribute, so RUF009 is a false positive.
ignore = ["RUF009"]
