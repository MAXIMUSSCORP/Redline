[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "redline"
version = "0.1.0"
description = "Screens building electrical design packages for a qualified reviewer."
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0", "Jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
redline = "redline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"redline.report" = ["*.j2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# _v() returns a fresh default_factory field per attribute, so RUF009 is a false positive.
ignore = ["RUF009"]
