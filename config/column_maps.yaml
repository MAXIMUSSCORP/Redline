config_version: "0.2-skeleton"
# Lower-case, strip punctuation. Exact alias = HIGH. Unique token-set match = MEDIUM. Else unparsed.

csv_panel_schedule:           # one circuit per row; owner adds aliases from real files
  panel_name:        ["panel", "panel name", "panel id", "pnl"]
  circuit_number:    ["ckt", "cct", "circuit", "circuit no", "circuit #", "circuit number"]
  poles:             ["poles", "pole", "p", "number of poles"]
  breaker_a:         ["breaker", "bkr", "trip", "amps", "ocpd", "rating"]
  conductor_size:    ["wire", "wire size", "conductor", "cable"]
  conductor_material: ["material", "cu/al"]
  insulation_temp_c: ["insulation", "temp rating", "wire temp"]
  length_m:          ["length", "run length", "distance"]
  load_va:           ["load", "load va", "connected load", "va", "apparent power"]
  load_kva:          ["kva", "load kva"]
  load_type:         ["load type", "type", "continuous", "load classification"]
  description:       ["description", "load description", "served", "desc", "load name"]
  phase:             ["phase", "ph"]
  voltage_v:         ["voltage", "volts"]
  conductors_in_raceway: ["conductors in raceway", "ccc"]
  ambient_c:         ["ambient", "ambient temp"]
  bonding_size:      ["bonding", "bonding size", "bond"]
  not_mapped:        ["phase label"]   # C7: a label, not a phase; lands in unparsed

panel_header_block:           # key/value lines above the table
  panel_name:     ["panel", "panel name", "designation"]
  voltage_v:      ["voltage", "volts", "supply"]
  phases:         ["phase", "phases", "ph"]
  bus_rating_a:   ["bus", "bus rating", "bus amps"]
  main_breaker_a: ["main", "main breaker", "main bkr", "mcb"]
  fed_from:       ["fed from", "supplied from", "source"]
  location:       ["location", "room"]

two_column_layout: { detect_when_headers_repeat: true, odd_circuits_on: "left" }   # confirm per project
aecad_export: { headers: {}, verified: false, source: "<fill from a real export>" }   # empty: every column goes to unparsed
aecad_project: { wdp_verified: false, mdb_tables_verified: false, wd_m_attribute_map: {} }   # filled from real files in M2

parsing:                      # lengths relative to text height, never absolute units
  row_tolerance_text_heights: 0.6
  column_gap_fraction: 0.5
  min_header_alias_matches: 3
  dxf_table_min_cells: 4
  dxf_stale_field_policy: "low"        # cells with evaluated=false are LOW
  dxf_prefer_extractor: "acad_plugin"  # or "oda_ezdxf"
  dxf_extractor_timeout_s: 120         # measured: plugin 2.17 s max, ODA 1.32 s max; owner accepted
  pdf_text_page_min_chars: 200         # below this: VECTOR_NO_TEXT or SCANNED (tune on real sheets)
  pdf_scanned_image_area_fraction: 0.8
  pdf_row_tolerance_word_heights: 0.6    # same start as DXF, tuned apart on real sheets
  pdf_column_gap_fraction: 0.5
  pdf_region_gap_word_heights: 3.0       # a blank gap this tall starts a new text region; tune on real sheets
  pdf_title_block_width_fraction: 0.25   # bottom-right crop, fraction of page width; tune on real sheets
  pdf_title_block_height_fraction: 0.2   # fraction of page height
  pdf_title_revision_max_chars: 4          # a revision is one token this short; tune on real sheets
  pdf_title_sheet_max_chars_without_digit: 4  # a sheet number with no digit is one token this short; tune on real sheets
  pdf_timeout_s: 300                     # placeholder until measured on real sheets
  render_dpi: 250
  crop_long_edge_px: 2500
  tile_overlap_fraction: 0.10
  accoreconsole_path: C:/Program Files/Autodesk/AutoCAD 2027/accoreconsole.exe   # D6; %VAR% expanded
  acad_plugin_dll: C:/Users/Zaidz/redline/plugin/RedlinePlugin.dll # path must hold no space (unquoted NETLOAD)
  odafc_path: C:/Program Files/ODA/ODAFileConverter 27.10.0/ODAFileConverter.exe # ODAFileConverter.exe

title_block:                             # exact alias after normalize_header; owner adds from real sheets
  sheet_number: ["sheet", "sheet no", "sheet number", "dwg no", "drawing no", "drawing number"]
  revision:     ["rev", "revision", "rev no"]
  other_labels: ["date", "scale", "by", "description", "drawn", "drawn by", "checked", "checked by", "approved", "approved by", "designed", "designed by", "project", "title", "client", "issue", "issued for", "project no", "project number", "project name", "job no", "job number", "sheet title", "drawing title", "of", "sheet of", "issue date", "date issued", "revision date", "rev date", "page", "file", "file name", "dwn", "drn", "chk", "chkd", "app", "appd", "dsgn", "eng"]   # labels that are never a value
