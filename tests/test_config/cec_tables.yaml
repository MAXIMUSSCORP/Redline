# TEST CONFIG. Every number below is made up to keep test arithmetic obvious. None is a code value.
# Odd numbers on purpose: 25 C ambient, 7000 VA demand tiers with a 0.43 remainder factor, and breaker ratings 7 13 29 41 53 97, so none can pass for a code value.
config_version: "test-0.1"
code_edition: "TEST EDITION, NOT CEC"
code_edition_verified: true

defaults: { conductors_in_raceway: null, ambient_c: 25, voltage_v: 100, power_factor: 1.0, conductor_material: "Cu", termination_temp_c: 75 }

rule_refs:
  ampacity: "TEST Rule AMP-1"
  continuous_load: "TEST Rule CON-1"
  voltage_drop: "TEST Rule VD-1"
  bonding: "TEST Rule BOND-1"
  panel_demand: "TEST Rule DEM-1"
  phase_balance: "TEST practice PB-1"
  completeness: "TEST drawing standard CMP-1"
  fire_alarm_exit_signs: "TODO [VERIFY]"
  fire_alarm_pull_stations: "TODO [VERIFY]"
  emergency_lighting: "TODO [VERIFY]"

tables:
  conductor_ampacity:         # material -> size -> insulation temp C -> amps
    verified: true
    source: "TEST ONLY, NOT CEC VALUES"
    values:
      copper:
        "14 AWG": { "60": 5, "75": 10, "90": 15 }
        "12 AWG": { "60": 10, "75": 20, "90": 33 }
        "10 AWG": { "60": 20, "75": 40, "90": 60 }
        "6 AWG": { "60": 50, "75": 100, "90": 150 }
      aluminum:
        "14 AWG": { "60": 2, "75": 5, "90": 8 }
        "12 AWG": { "60": 5, "75": 10, "90": 15 }
        "10 AWG": { "60": 10, "75": 20, "90": 30 }
        "6 AWG": { "60": 25, "75": 47, "90": 75 }
  ambient_temp_correction:    # insulation temp C -> [[ambient_upper_bound_c, factor], ...]
    verified: true
    source: "TEST ONLY, NOT CEC VALUES"
    values:
      "60": [[25, 1.0], [40, 0.5], [60, 0.25]]
      "75": [[25, 1.0], [40, 0.5], [60, 0.25]]
      "90": [[25, 1.0], [40, 0.5], [60, 0.25]]
  conductor_count_correction: # [[max_conductor_count, factor], ...]
    verified: true
    source: "TEST ONLY, NOT CEC VALUES"
    values: [[4, 1.0], [6, 0.5], [100, 0.25]]
  continuous_load:
    verified: true
    source: "TEST ONLY, NOT CEC VALUES"
    max_fraction_of_breaker: 0.5
  standard_breaker_ratings: { verified: true, source: "TEST ONLY, NOT CEC VALUES", values_a: [7, 13, 29, 41, 53, 97] }
  allow_next_standard_size: { verified: true, source: "TEST ONLY, NOT CEC VALUES", enabled: false }
  bonding_conductor_size:     # ascending by max_ocpd_a
    verified: true
    source: "TEST ONLY, NOT CEC VALUES"
    values:
      - { max_ocpd_a: 17, copper_size: "14 AWG", aluminum_size: "12 AWG" }
      - { max_ocpd_a: 40, copper_size: "12 AWG", aluminum_size: "10 AWG" }
      - { max_ocpd_a: 100, copper_size: "10 AWG", aluminum_size: "10 AWG" }
  conductor_size_order: { verified: true, source: "TEST ONLY, NOT CEC VALUES", values: ["14 AWG", "12 AWG", "10 AWG", "6 AWG"] }
  voltage_drop:
    verified: true
    source: "TEST ONLY, NOT CEC VALUES"
    method: "k_factor"
    branch_max_pct: 2
    feeder_max_pct: 2
    total_max_pct: 3.5
    current_basis: "load"
    show_passing: false
    k_factor:
      constant_by_material: { copper: 10, aluminum: 20 }
      area_by_size: { "14 AWG": 2, "12 AWG": 4, "10 AWG": 8, "6 AWG": 20 }
      length_unit_note: "metres"
      phase_multiplier: { single: 2, three: 1 }
    impedance:
      power_factor: 1.0
      phase_multiplier: { single: 2, three: 1 }
      per_size:
        copper:
          "14 AWG": { r: 5, x: 0 }
          "12 AWG": { r: 2, x: 0 }
          "10 AWG": { r: 1, x: 0 }
          "6 AWG": { r: 0.5, x: 0 }
        aluminum:
          "14 AWG": { r: 10, x: 0 }
          "12 AWG": { r: 4, x: 0 }
          "10 AWG": { r: 2, x: 0 }
          "6 AWG": { r: 1, x: 0 }
  demand_factors:
    verified: true
    source: "TEST ONLY, NOT CEC VALUES"
    default_method: "computed"
    supplied_vs_computed_tolerance_pct: 10
    # Tiers by cumulative VA. The last tier uses a huge bound, since the test config holds no null.
    by_load_type:
      continuous: [{ up_to_va: 7000, factor: 1.0 }, { up_to_va: 700000000, factor: 0.43 }]
      noncontinuous: [{ up_to_va: 7000, factor: 1.0 }, { up_to_va: 700000000, factor: 0.43 }]
      receptacle: [{ up_to_va: 7000, factor: 1.0 }, { up_to_va: 700000000, factor: 0.43 }]
      motor: [{ up_to_va: 700000000, factor: 1.0 }]
      unknown: [{ up_to_va: 700000000, factor: 1.0 }]
    bus_loading_limit_fraction: 1.0
    main_loading_limit_fraction: 0.5
  phase_balance: { verified: true, source: "TEST ONLY, NOT CEC VALUES", max_deviation_pct: 10, min_circuits_to_check: 3 }
  phase_layout:
    verified: true
    source: "TEST ONLY, NOT CEC VALUES"
    three_phase_pattern: ["A", "A", "B", "B", "C", "C"]
    single_phase_pattern: ["A", "B"]

completeness: { require_description: true, require_load: true, require_breaker: true, require_conductor_size: true, spare_keywords: ["SPARE", "SPACE"], placeholder_texts: ["TBD", "-", "N/A"], severity: "NEEDS_REVIEW" }
